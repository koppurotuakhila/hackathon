<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Attack Encyclopedia — IDS</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;600;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:     #0d0d0e;
  --panel:  #07090f;
  --border: #0e1520;
  --text:   #9ab0cc;
  --bright: #ddeeff;
  --mono:   'IBM Plex Mono', monospace;
  --sans:   'Oxanium', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Animated particle bg */
.particle-bg {
  position: fixed; inset: 0; z-index: 0;
  overflow: hidden; pointer-events: none;
}
.particle {
  position: absolute;
  width: 2px; height: 2px;
  border-radius: 50%;
  animation: float linear infinite;
  opacity: 0;
}
@keyframes float {
  0%   { transform: translateY(100vh) translateX(0); opacity: 0; }
  10%  { opacity: 0.6; }
  90%  { opacity: 0.4; }
  100% { transform: translateY(-10vh) translateX(60px); opacity: 0; }
}

/* ── Header ── */
header {
  position: relative; z-index: 10;
  padding: 22px 40px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: rgba(3,5,8,0.92);
  backdrop-filter: blur(12px);
}

.hdr-left { display: flex; align-items: center; gap: 16px; }

.hdr-icon {
  width: 42px; height: 42px;
  border-radius: 6px;
  background: linear-gradient(135deg, #ff304020, #ff304040);
  border: 1px solid #ff3040;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  box-shadow: 0 0 20px rgba(255,48,64,0.3);
}

.hdr-title {
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 600;
  color: var(--bright);
  letter-spacing: 0.1em;
}
.hdr-sub {
  font-size: 10px;
  color: #ff3040;
  letter-spacing: 0.2em;
  margin-top: 2px;
  font-family: var(--mono);
}

.back-btn {
  font-family: var(--mono);
  font-size: 11px;
  padding: 9px 20px;
  border: 1px solid #1a2a3a;
  color: var(--text);
  background: transparent;
  border-radius: 4px;
  cursor: pointer;
  letter-spacing: 0.08em;
  text-decoration: none;
  transition: all 0.2s;
}
.back-btn:hover { border-color: var(--text); color: var(--bright); }

/* ── Hero ── */
.hero {
  position: relative; z-index: 1;
  text-align: center;
  padding: 60px 40px 40px;
}

.hero-label {
  font-family: var(--mono);
  font-size: 10px;
  color: #ff3040;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  margin-bottom: 14px;
}

.hero-title {
  font-size: clamp(28px, 5vw, 52px);
  font-weight: 800;
  color: var(--bright);
  line-height: 1.1;
  margin-bottom: 16px;
}

.hero-title span {
  color: #ff3040;
  position: relative;
}

.hero-desc {
  font-size: 15px;
  color: var(--text);
  max-width: 560px;
  margin: 0 auto 32px;
  line-height: 1.7;
}

/* Quick nav pills */
.nav-pills {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
  margin-bottom: 8px;
}
.nav-pill {
  font-family: var(--mono);
  font-size: 13px;
  padding: 10px 22px;
  border-radius: 20px;
  border: 2px solid;
  cursor: pointer;
  letter-spacing: 0.08em;
  text-decoration: none;
  transition: all 0.15s;
  display: inline-block;
}
.nav-pill:hover { transform: translateY(-2px); }

/* ── Main content ── */
main {
  position: relative; z-index: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 32px 60px;
}

/* ── Attack section ── */
.attack-section {
  margin-bottom: 48px;
}

.attack-wrapper {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.attack-wrapper:hover {
  border-color: var(--atk-color);
  box-shadow: 0 0 40px rgba(0,0,0,0.4), inset 0 0 40px rgba(0,0,0,0.1);
}

/* Top bar */
.attack-topbar {
  display: flex; align-items: center; gap: 0;
  border-bottom: 1px solid var(--border);
  background: rgba(0,0,0,0.3);
}

.attack-number {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--atk-color);
  padding: 14px 20px;
  border-right: 1px solid var(--border);
  letter-spacing: 0.15em;
  opacity: 0.7;
}

.attack-badge {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 20px;
  flex: 1;
}

.attack-emoji { font-size: 22px; }

.attack-title-text {
  font-family: var(--mono);
  font-size: 16px;
  font-weight: 600;
  color: var(--bright);
  letter-spacing: 0.08em;
}

.severity-chip {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10px;
  padding: 4px 12px;
  border-radius: 3px;
  border: 1px solid var(--atk-color);
  color: var(--atk-color);
  background: rgba(0,0,0,0.3);
  letter-spacing: 0.12em;
  margin-right: 20px;
}

/* Body: 2 columns */
.attack-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
}

.attack-info {
  padding: 24px;
  border-right: 1px solid var(--border);
}

.attack-summary {
  font-size: 14px;
  line-height: 1.8;
  color: var(--text);
  margin-bottom: 20px;
}

.info-section { margin-bottom: 16px; }

.info-label {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--atk-color);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.info-tags { display: flex; flex-wrap: wrap; gap: 6px; }

.tag {
  font-family: var(--mono);
  font-size: 10px;
  padding: 4px 10px;
  border-radius: 3px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  color: var(--text);
}

.stat-row {
  display: flex; gap: 16px; margin-bottom: 12px;
}

.stat-box {
  flex: 1;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 14px;
  text-align: center;
}

.stat-box-val {
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 600;
  color: var(--atk-color);
  line-height: 1;
}

.stat-box-lbl {
  font-size: 10px;
  color: var(--text);
  margin-top: 4px;
  opacity: 0.7;
}

/* Visualization panel */
.attack-viz {
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.viz-title {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--atk-color);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 4px;
}

/* ── SVG diagrams ── */
.viz-diagram {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

svg.diagram { width: 100%; max-height: 200px; overflow: visible; }

/* Severity meter */
.severity-meter { margin-top: auto; }

.meter-track {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 6px;
}

.meter-fill {
  height: 100%;
  border-radius: 3px;
  background: var(--atk-color);
  box-shadow: 0 0 8px var(--atk-color);
  transition: width 1.5s ease;
  width: 0%;
}

/* Responsive */
@media (max-width: 800px) {
  .attack-body { grid-template-columns: 1fr; }
  .attack-info { border-right: none; border-bottom: 1px solid var(--border); }
  header { padding: 16px 20px; }
  main { padding: 0 16px 40px; }
}
</style>
</head>
<body>

<!-- Particles -->
<div class="particle-bg" id="particleBg"></div>

<!-- Header -->
<header>
  <div class="hdr-left">
    <div class="hdr-icon">⚔</div>
    <div>
      <div class="hdr-title">ATTACK ENCYCLOPEDIA</div>
      <div class="hdr-sub">CICIDS2017 · 7 ATTACK CLASSES · LSTM DETECTED</div>
    </div>
  </div>
  <a href="http://127.0.0.1:8080/index.html" class="back-btn">← BACK</a>
</header>

<!-- Hero -->
<div class="hero" style="position:relative;z-index:1">
  <div class="hero-label">Threat Intelligence Database</div>
  <h1 class="hero-title">Know Your <span>Attackers</span></h1>
  <p class="hero-desc">

  <div class="nav-pills" id="navPills"></div>

<!-- Main -->
<main id="attacksContainer"></main>

<script>
// ── Attack data ──
const ATTACKS = [

// ── SVG Diagrams ──
function getDiagram(type, color) {
  const c = color;
  const dim = c + '40';

  switch(type) {
    case 'botnet': return `
      <svg class="diagram" viewBox="0 0 320 180">
        <!-- C&C Server -->
        <rect x="130" y="10" width="60" height="34" rx="4" fill="${dim}" stroke="${c}" stroke-width="1.5"/>
        <text x="160" y="32" text-anchor="middle" fill="${c}" font-size="10" font-family="IBM Plex Mono">C&amp;C</text>
        <!-- Lines to bots -->
        ${[40,100,160,220,280].map((x,i) => `<line x1="160" y1="44" x2="${x}" y2="110" stroke="${c}" stroke-width="1" stroke-dasharray="4,3" opacity="0.5">
          <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="${0.8+i*0.1}s" repeatCount="indefinite"/>
        </line>`).join('')}
        <!-- Bot nodes -->
        ${[40,100,160,220,280].map((x,i) => `
          <circle cx="${x}" cy="120" r="14" fill="${dim}" stroke="${c}" stroke-width="1.5"/>
          <text x="${x}" y="125" text-anchor="middle" fill="${c}" font-size="9" font-family="IBM Plex Mono">BOT</text>
        `).join('')}
        <!-- Attack lines to target -->
        ${[40,100,160,220,280].map((x,i) => `<line x1="${x}" y1="134" x2="160" y2="165" stroke="${c}" stroke-width="1.5" opacity="0.7">
          <animate attributeName="opacity" values="0.2;0.9;0.2" dur="${0.6+i*0.15}s" repeatCount="indefinite"/>
        </line>`).join('')}
        <!-- Target -->
        <rect x="120" y="155" width="80" height="20" rx="3" fill="${dim}" stroke="${c}" stroke-width="1.5"/>
        <text x="160" y="169" text-anchor="middle" fill="${c}" font-size="9" font-family="IBM Plex Mono">TARGET</text>
      </svg>`;

    case 'bruteforce': return `
      <svg class="diagram" viewBox="0 0 320 180">
        <!-- Attacker -->
        <rect x="10" y="70" width="70" height="36" rx="4" fill="${dim}" stroke="${c}" stroke-width="1.5"/>
        <text x="45" y="91" text-anchor="middle" fill="${c}" font-size="9" font-family="IBM Plex Mono">ATTACKER</text>
        <!-- Attempts -->
        ${['abc123','password','p@ss1','admin1','qwerty'].map((pw,i) => `
          <text x="110" y="${30+i*30}" fill="${c}" font-size="9" font-family="IBM Plex Mono" opacity="${i===3?1:0.35}">
            ${i===3?'✓':i===4?'▶':'✗'} ${pw}
          </text>
          ${i<4?`<line x1="80" y1="88" x2="108" y2="${22+i*30}" stroke="${c}" stroke-width="0.8" opacity="0.2"/>`:``}
        `).join('')}
        <!-- Lock/Server -->
        <rect x="240" y="60" width="70" height="56" rx="4" fill="${dim}" stroke="${c}" stroke-width="1.5"/>
        <text x="275" y="82" text-anchor="middle" fill="${c}" font-size="9" font-family="IBM Plex Mono">SERVER</text>
        <text x="275" y="100" text-anchor="middle" fill="${c}" font-size="16">🔒</text>
        <!-- Success arrow -->
        <line x1="200" y1="100" x2="238" y2="90" stroke="${c}" stroke-width="2">
          <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
        </line>
        <text x="160" y="155" text-anchor="middle" fill="${c}" font-size="9" font-family="IBM Plex Mono" opacity="0.6">TRYING ALL COMBINATIONS...</text>
      </svg>`;

    case 'ddos': return `
      <svg class="diagram" viewBox="0 0 320 180">
        <!-- Target server center -->
        <rect x="120" y="70" width="80" height="40" rx="6" fill="${dim}" stroke="${c}" stroke-width="2"/>
        <text x="160" y="94" text-anchor="middle" fill="${c}" font-size="10" font-family="IBM Plex Mono">SERVER</text>
        <!-- Attack waves from all directions -->
        ${Array.from({length:12},(_,i)=>{
          const angle = (i/12)*Math.PI*2;
          const sx = 160 + Math.cos(angle)*130;
          const sy = 90 + Math.sin(angle)*75;
          const ex = 160 + Math.cos(angle)*55;
          const ey = 90 + Math.sin(angle)*30;
          return `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${c}" stroke-width="1.5" opacity="0.6">
            <animate attributeName="opacity" values="0.1;0.8;0.1" dur="${0.4+i*0.07}s" repeatCount="indefinite"/>
          </line>
          <circle cx="${sx}" cy="${sy}" r="5" fill="${dim}" stroke="${c}" stroke-width="1"/>`;
        }).join('')}
        <!-- Overwhelm text -->
        <text x="160" y="155" text-anchor="middle" fill="${c}" font-size="9" font-family="IBM Plex Mono" opacity="0.7">FLOODING FROM ALL DIRECTIONS</text>
        <!-- Pulse on server -->
        <rect x="120" y="70" width="80" height="40" rx="6" fill="none" stroke="${c}" stroke-width="1">
          <animate attributeName="opacity" values="0.8;0;0.8" dur="0.8s" repeatCount="indefinite"/>
        </rect>
      </svg>`;

    case 'dos': return `
      <svg class="diagram" viewBox="0 0 320 180">
        <!-- Timeline bars showing connection drain -->
        <text x="16" y="20" fill="${c}" font-size="9" font-family="IBM Plex Mono" opacity="0.7">SERVER CONNECTIONS</text>
        <!-- Connection slots -->
        ${Array.from({length:10},(_,i)=>`
          <rect x="16" y="${28+i*13}" width="200" height="9" rx="2" fill="${dim}" stroke="${c}" stroke-width="0.8" opacity="0.3"/>
          <rect x="16" y="${28+i*13}" width="${i<7?200:i===7?120:i===8?60:20}" height="9" rx="2" fill="${c}" opacity="${i<7?0.6:0.9}">
            ${i>=7?`<animate attributeName="width" values="${200-i*20};${10};${200-i*20}" dur="1.5s" repeatCount="indefinite"/>`:''}
          </rect>
          <text x="224" y="${37+i*13}" fill="${c}" font-size="8" font-family="IBM Plex Mono">${i<7?'OCCUPIED':i===7?'DRAINING':'SLOW...'}</text>
        `).join('')}
        <text x="16" y="168" fill="${c}" font-size="9" font-family="IBM Plex Mono" opacity="0.6">ALL SLOTS CONSUMED → LEGITIMATE USERS BLOCKED</text>
      </svg>`;

    case 'portscan': return `
      <svg class="diagram" viewBox="0 0 320 180">
        <!-- Target host -->
        <rect x="210" y="20" width="90" height="140" rx="6" fill="${dim}" stroke="${c}" stroke-width="1.5" opacity="0.5"/>
        <text x="255" y="15" text-anchor="middle" fill="${c}" font-size="9" font-family="IBM Plex Mono">HOST</text>
        <!-- Ports -->
        ${[[22,'SSH',true],[80,'HTTP',true],[443,'HTTPS',true],[3306,'MySQL',false],[8080,'Dev',false]].map(([port,svc,open],i)=>`
          <rect x="218" y="${30+i*24}" width="74" height="18" rx="3" fill="${open?c+'30':'#ffffff08'}" stroke="${open?c:'#1a2a3a'}" stroke-width="1"/>
          <text x="226" y="${43+i*24}" fill="${open?c:'#2a4060'}" font-size="8" font-family="IBM Plex Mono">${port} ${svc} ${open?'●':'○'}</text>
        `).join('')}
        <!-- Scanner -->
        <rect x="20" y="70" width="65" height="36" rx="4" fill="${dim}" stroke="${c}" stroke-width="1.5"/>
        <text x="52" y="91" text-anchor="middle" fill="${c}" font-size="9" font-family="IBM Plex Mono">SCANNER</text>
        <!-- Probe lines -->
        ${[0,1,2,3,4].map(i=>`
          <line x1="85" y1="88" x2="210" y2="${39+i*24}" stroke="${c}" stroke-width="1" stroke-dasharray="3,3">
            <animate attributeName="opacity" values="0;1;0" dur="${0.5+i*0.2}s" begin="${i*0.15}s" repeatCount="indefinite"/>
          </line>
        `).join('')}
        <text x="16" y="165" fill="${c}" font-size="9" font-family="IBM Plex Mono" opacity="0.6">PROBING EACH PORT SYSTEMATICALLY...</text>
      </svg>`;

    case 'webattack': return `
      <svg class="diagram" viewBox="0 0 320 180">
        <!-- Browser -->
        <rect x="10" y="20" width="100" height="60" rx="4" fill="${dim}" stroke="${c}" stroke-width="1.5"/>
        <text x="60" y="38" text-anchor="middle" fill="${c}" font-size="8" font-family="IBM Plex Mono">BROWSER</text>
        <rect x="18" y="44" width="84" height="28" rx="2" fill="rgba(0,0,0,0.4)" stroke="${c}" stroke-width="0.8" opacity="0.5"/>
        <text x="60" y="56" text-anchor="middle" fill="${c}" font-size="7" font-family="IBM Plex Mono">'; DROP TABLE--</text>
        <text x="60" y="67" text-anchor="middle" fill="${c}" font-size="7" font-family="IBM Plex Mono">&lt;script&gt;alert(1)&lt;/script&gt;</text>
        <!-- Arrow -->
        <line x1="110" y1="50" x2="148" y2="50" stroke="${c}" stroke-width="1.5" marker-end="url(#arr)"/>
        <defs><marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="${c}"/>
        </marker></defs>
        <!-- Web Server -->
        <rect x="150" y="20" width="80" height="60" rx="4" fill="${dim}" stroke="${c}" stroke-width="1.5"/>
        <text x="190" y="48" text-anchor="middle" fill="${c}" font-size="9" font-family="IBM Plex Mono">WEB</text>
        <text x="190" y="62" text-anchor="middle" fill="${c}" font-size="9" font-family="IBM Plex Mono">SERVER</text>
        <!-- Database -->
        <ellipse cx="270" cy="65" rx="35" ry="14" fill="${dim}" stroke="${c}" stroke-width="1.5"/>
        <line x1="235" y1="65" x2="235" y2="85" stroke="${c}" stroke-width="1.5"/>
        <line x1="305" y1="65" x2="305" y2="85" stroke="${c}" stroke-width="1.5"/>
        <ellipse cx="270" cy="85" rx="35" ry="14" fill="${dim}" stroke="${c}" stroke-width="1.5"/>
        <text x="270" y="89" text-anchor="middle" fill="${c}" font-size="8" font-family="IBM Plex Mono">DATABASE</text>
        <line x1="230" y1="65" x2="268" y2="52" stroke="${c}" stroke-width="1.5"/>
        <!-- Payload labels -->
        <text x="60" y="110" text-anchor="middle" fill="${c}" font-size="8" font-family="IBM Plex Mono" opacity="0.8">SQL INJECTION</text>
        <text x="160" y="130" text-anchor="middle" fill="${c}" font-size="8" font-family="IBM Plex Mono" opacity="0.8">XSS / CSRF</text>
        <text x="270" y="115" text-anchor="middle" fill="${c}" font-size="8" font-family="IBM Plex Mono" opacity="0.8">DATA STOLEN</text>
        <text x="160" y="160" text-anchor="middle" fill="${c}" font-size="9" font-family="IBM Plex Mono" opacity="0.5">MALICIOUS PAYLOADS EXPLOIT APP LOGIC</text>
      </svg>`;

    case 'normal': return `
      <svg class="diagram" viewBox="0 0 320 180">
        <!-- Normal traffic flow -->
        <text x="16" y="18" fill="${c}" font-size="9" font-family="IBM Plex Mono" opacity="0.7">TRAFFIC ANALYSIS</text>
        ${['HTTP Request','DNS Query','TLS Handshake','API Call','File Transfer'].map((label,i)=>{
          const w = [160,100,180,120,140][i];
          return `
          <rect x="16" y="${28+i*26}" width="${w}" height="14" rx="2" fill="${c}" opacity="${0.15+i*0.05}">
            <animate attributeName="width" from="0" to="${w}" dur="${0.5+i*0.1}s" fill="freeze"/>
          </rect>
          <text x="24" y="${39+i*26}" fill="${c}" font-size="8" font-family="IBM Plex Mono">${label}</text>
          <text x="${16+w+6}" y="${39+i*26}" fill="${c}" font-size="8" font-family="IBM Plex Mono" opacity="0.5">✓ SAFE</text>`;
        }).join('')}
        <!-- LSTM model box -->
        <rect x="220" y="40" width="88" height="90" rx="6" fill="${c}18" stroke="${c}" stroke-width="1.5"/>
        <text x="264" y="68" text-anchor="middle" fill="${c}" font-size="8" font-family="IBM Plex Mono">LSTM</text>
        <text x="264" y="82" text-anchor="middle" fill="${c}" font-size="8" font-family="IBM Plex Mono">MODEL</text>
        <text x="264" y="104" text-anchor="middle" fill="${c}" font-size="18">🧠</text>
        <text x="264" y="158" text-anchor="middle" fill="${c}" font-size="8" font-family="IBM Plex Mono" opacity="0.6">BASELINE NORMAL</text>
      </svg>`;

    default: return `<svg class="diagram" viewBox="0 0 320 180"><text x="160" y="90" text-anchor="middle" fill="${color}" font-size="40">${ATTACKS.find(a=>a.vizType===type)?.emoji||'⚠'}</text></svg>`;
  }
}

// ── Build nav pills ──
function buildNav() {
  const container = document.getElementById('navPills');
  ATTACKS.forEach(atk => {
    const a = document.createElement('a');
    a.href = `#${atk.id}`;
    a.className = 'nav-pill';
    a.textContent = `${atk.emoji} ${atk.name}`;
    a.style.cssText = `border-color:${atk.color}40;color:${atk.color};`;
    a.addEventListener('mouseenter', () => {
      a.style.background = atk.color + '20';
      a.style.borderColor = atk.color;
    });
    a.addEventListener('mouseleave', () => {
      a.style.background = 'transparent';
      a.style.borderColor = atk.color + '40';
    });
    container.appendChild(a);
  });
}

// ── Build attack sections ──
function buildAttacks() {
  const container = document.getElementById('attacksContainer');
  ATTACKS.forEach((atk, idx) => {
    const section = document.createElement('div');
    section.className = 'attack-section';
    section.id = atk.id;

    section.innerHTML = `
      <div class="attack-wrapper" style="--atk-color:${atk.color}">
        <div class="attack-topbar">
          <div class="attack-number">0${idx+1}</div>
          <div class="attack-badge">
            <span class="attack-emoji">${atk.emoji}</span>
            <span class="attack-title-text">${atk.name}</span>
          </div>
          ${atk.severity > 0 ? `<div class="severity-chip">${atk.severityLabel}</div>` : `<div class="severity-chip" style="border-color:#00e67640;color:#00e676">SAFE</div>`}
        </div>

        <div class="attack-body">
          <div class="attack-info">
            <p class="attack-summary">${atk.summary}</p>

            <div class="stat-row">
              ${atk.stats.map(s=>`
                <div class="stat-box">
                  <div class="stat-box-val">${s.val}</div>
                  <div class="stat-box-lbl">${s.lbl}</div>
                </div>`).join('')}
            </div>

            <div class="info-section">
              <div class="info-label">Common Targets</div>
              <div class="info-tags">
                ${atk.targets.map(t=>`<span class="tag">${t}</span>`).join('')}
              </div>
            </div>

            <div class="info-section">
              <div class="info-label">Attack Vectors</div>
              <div class="info-tags">
                ${atk.vectors.map(v=>`<span class="tag">${v}</span>`).join('')}
              </div>
            </div>

            <div class="info-section">
              <div class="info-label">Impact</div>
              <div style="font-size:12px;color:var(--text);line-height:1.6">${atk.impact}</div>
            </div>
          </div>

          <div class="attack-viz">
            <div class="viz-title">ATTACK VISUALIZATION</div>
            <div class="viz-diagram">
              ${getDiagram(atk.vizType, atk.color)}
            </div>
            ${atk.severity > 0 ? `
            <div class="severity-meter">
              <div class="viz-title">SEVERITY LEVEL — ${atk.severity}/100</div>
              <div class="meter-track">
                <div class="meter-fill" data-width="${atk.severity}%" style="width:0%"></div>
              </div>
            </div>` : `
            <div class="severity-meter">
              <div class="viz-title">SEVERITY LEVEL — 0/100 (BASELINE)</div>
              <div class="meter-track">
                <div class="meter-fill" data-width="5%" style="width:0%;background:#00e676;box-shadow:0 0 8px #00e676"></div>
              </div>
            </div>`}
          </div>
        </div>
      </div>`;

    container.appendChild(section);
  });

  // Animate severity bars on scroll
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const fill = entry.target.querySelector('.meter-fill');
        if (fill) {
          fill.style.width = fill.dataset.width;
        }
      }
    });
  }, { threshold: 0.3 });

  document.querySelectorAll('.attack-section').forEach(s => observer.observe(s));
}

// ── Particles ──
function buildParticles() {
  const bg = document.getElementById('particleBg');
  const colors = ['#ff3060','#b040ff','#00ccff','#ff8800','#00e676'];
  for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.cssText = `
      left: ${Math.random()*100}%;
      background: ${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration: ${8+Math.random()*12}s;
      animation-delay: ${Math.random()*10}s;
      width: ${1+Math.random()*2}px;
      height: ${1+Math.random()*2}px;
    `;
    bg.appendChild(p);
  }
}

buildParticles();
buildNav();
buildAttacks();
</script>
</body>
</html>
